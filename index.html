<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empire & Alchemy: Vienna - Prague</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;700&family=Shippori+Mincho:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Shippori Mincho"', 'serif'],
                        serif: ['"Shippori Mincho"', 'serif'],
                        display: ['"Cinzel"', 'serif'],
                    },
                    colors: {
                        gold: {
                            100: '#fbf4e2',
                            200: '#f5e4be',
                            300: '#eccf8d',
                            400: '#e3b861',
                            500: '#c5a059', // Primary Gold
                            600: '#b68845',
                            700: '#926636',
                            800: '#785332',
                            900: '#63452d',
                        },
                        paper: '#f9f8f4',
                        dark: '#111111',
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 1s ease-out forwards',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #111;
            color: #fff;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Film Grain Texture Overlay */
        .grain-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            opacity: 0.04; /* Slightly reduced for mobile readability */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Vignette Effect */
        .vignette-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 40;
            background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.4) 100%);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #111;
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #c5a059;
        }

        /* Drop Cap Responsive */
        .drop-cap {
            float: left;
            font-size: 3.2rem; /* Smaller on mobile by default */
            line-height: 0.8;
            margin-right: 10px;
            margin-top: 6px;
            font-family: 'Cinzel', serif;
            color: #c5a059;
        }
        
        @media (min-width: 768px) {
            .drop-cap {
                font-size: 3.8rem;
                margin-right: 12px;
                margin-top: 4px;
            }
        }

        /* Smooth Scroll behavior */
        html {
            scroll-behavior: smooth;
        }
    </style>
